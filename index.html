<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مدرسة الرمادي المحدثة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            teal: '#0d9488'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-gradient-to-r from-brand-800 to-brand-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-brand-teal p-2 rounded-xl text-white font-bold text-xl">🏫</div>
                <div>
                    <h1 class="text-xl font-bold">مدرسة الرمادي المحدثة</h1>
                    <p class="text-xs text-brand-50">منصة الإدارة والتعليم الإلكتروني</p>
                </div>
            </div>
            <div id="nav-auth-section">
                <button onclick="openLoginModal()" class="bg-brand-teal hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        <!-- Landing Section -->
        <div id="landing-view" class="space-y-8">
            <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 text-center space-y-4">
                <h2 class="text-3xl font-black text-brand-800">مرحباً بكم في مدرسة الرمادي المحدثة</h2>
                <p class="text-slate-600 max-w-2xl mx-auto">منظومة تعليمية متكاملة لإدارة الطلاب، المعلمين، الحضور والتقييمات بكل سلاسة وأمان.</p>
                <div class="pt-4 flex justify-center gap-4">
                    <button onclick="openLoginModal()" class="bg-brand-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-brand-700 shadow-md">دخول النظام</button>
                </div>
            </div>
        </div>

        <!-- Dynamic Portal Views -->
        <div id="app-view" class="hidden">
            <!-- سيتم تحميل لوحات التحكم هنا ديناميكياً حسب الصلاحية -->
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-brand-800">تسجيل الدخول للنظام</h3>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-semibold mb-1">البريد الإلكتروني أو رمز الدخول:</label>
                    <input type="text" id="login-email" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-600 outline-none" placeholder="أدخل البريد أو رمز الوصول">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">كلمة المرور:</label>
                    <input type="password" id="login-password" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-600 outline-none" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" class="w-full bg-brand-600 text-white py-2 rounded-lg font-bold hover:bg-brand-700 transition">دخول</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        جميع الحقوق محفوظة © 2026 - مدرسة الرمادي المحدثة
    </footer>

    <!-- App Logic Script -->
    <script>
        // إعدادات اتصال Supabase (قم بتحديثها بالقيم الخاصة بك لاحقاً)
        const SUPABASE_URL = 'https://your-project-id.supabase.co';
        const SUPABASE_ANON_KEY = 'your-anon-key-here';
        
        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.log('Supabase not fully configured yet');
        }

        function openLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
        }
        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }
        function handleLogin() {
            alert('جاري التحقق من بيانات الدخول...');
            closeLoginModal();
        }
    </script>
</body>
</html>
